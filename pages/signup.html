<!-- Signup — Client Portal, Premium Editorial -->
<section class="ax-page">
    <div class="ax-bg">
        <img src="https://i.pinimg.com/736x/0d/79/36/0d79368a1e7258d267c078987ba59cf2.jpg" alt="InteriHub" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMyQTIzMkEiLz48L3N2Zz4=';">
        <div class="ax-overlay" aria-hidden="true"></div>
    </div>
    <p class="ax-quote">&ldquo;Every commission begins with a conversation.&rdquo;</p>
    <p class="ax-coords">Plate 01 &mdash; The InteriHub Archive &middot; Est. 2020</p>

    <div class="ax-center">
        <span class="ax-num" aria-hidden="true">II</span>
        <div class="ax-plate">
            <p class="ax-eyebrow">Client Portal &mdash; Est. 2020</p>
            <h1 class="ax-title">Request <em>Access</em></h1>
            <p class="ax-sub">Apply for a client portal account to begin your journey.</p>

            <div class="ax-rule" aria-hidden="true"><span class="ax-rule-diamond"></span></div>

            <form class="ax-form">
                <div class="ax-field">
                    <div class="ax-field-head">
                        <span class="ax-field-num">01</span>
                        <label for="ax-name">Full Name</label>
                    </div>
                    <div class="ax-input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                        <input id="ax-name" type="text" required autocomplete="name" placeholder="Your name">
                    </div>
                </div>
                <div class="ax-field">
                    <div class="ax-field-head">
                        <span class="ax-field-num">02</span>
                        <label for="ax-email">Email Address</label>
                    </div>
                    <div class="ax-input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>
                        <input id="ax-email" type="email" required autocomplete="email" placeholder="you@example.com">
                    </div>
                </div>
                <div class="ax-field">
                    <div class="ax-field-head">
                        <span class="ax-field-num">03</span>
                        <label for="ax-type">Project Type</label>
                    </div>
                    <div class="ax-input">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h12"/></svg>
                        <select id="ax-type" required>
                            <option value="">Select an option</option>
                            <option value="renovation">Full Renovation</option>
                            <option value="furnishing">Bespoke Furnishing</option>
                            <option value="commercial">Commercial Space</option>
                        </select>
                        <svg class="ax-select-chevron" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
                    </div>
                </div>
                <button type="submit" class="ax-submit">Submit Request <span aria-hidden="true">&rarr;</span></button>
            </form>

            <p class="ax-secure">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                Access reviewed within 48 hours
            </p>
        </div>

        <p class="ax-alt">Already have an account? <a href="/login" data-route>Sign In</a></p>
    </div>
</section>
