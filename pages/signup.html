<section class="auth-v2-page">
    <div class="ax-bg">
        <img src="https://i.pinimg.com/736x/0d/79/36/0d79368a1e7258d267c078987ba59cf2.jpg" alt="InteriHub" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMyQTIzMkEiLz48L3N2Zz4=';">
        <div class="ax-overlay" aria-hidden="true"></div>
    </div>
    
    <div class="auth-v2-container">
        <div class="auth-v2-card">
            <a href="/" data-route class="auth-v2-logo" style="text-decoration: none;">
                <img src="assets/logo.svg" alt="InteriHub Logo" width="32" height="32">
                <div style="display: flex; flex-direction: column; justify-content: center; line-height: 1;">
                    <span class="auth-v2-brand-text" style="line-height: 1;">INTERI<span style="color: var(--color-antique-gold);">HUB</span></span>
                    <span style="font-size: 0.55rem; font-family: var(--font-body); letter-spacing: 0.05em; color: var(--color-antique-gold); font-weight: 500; margin-top: 2px;">Where Elegance Meets Comfort.</span>
                </div>
            </a>
            <h1 class="auth-v2-title">Create Account</h1>
            <p class="auth-v2-subtitle">Join our community and start your design journey.</p>
            
            <form class="auth-v2-form">
                <div class="auth-v2-field">
                    <label>Full Name</label>
                    <div class="auth-v2-input-wrap">
                        <input type="text" placeholder="Your full name" required>
                    </div>
                </div>
                <div class="auth-v2-field">
                    <label>Email Address</label>
                    <div class="auth-v2-input-wrap">
                        <input type="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="auth-v2-field">
                    <label>Phone Number</label>
                    <div class="auth-v2-input-wrap">
                        <input type="tel" placeholder="(555) 123-4567" required>
                    </div>
                </div>
                <div class="auth-v2-field">
                    <label>Password</label>
                    <div class="auth-v2-input-wrap">
                        <input type="password" id="auth-pwd-s" placeholder="Create a strong password" required>
                        <button type="button" class="auth-v2-eye" onclick="var i=document.getElementById('auth-pwd-s');i.type=i.type==='password'?'text':'password';">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                <div class="auth-v2-field">
                    <label>Confirm Password</label>
                    <div class="auth-v2-input-wrap">
                        <input type="password" id="auth-pwd-c" placeholder="Re-enter your password" required>
                        <button type="button" class="auth-v2-eye" onclick="var i=document.getElementById('auth-pwd-c');i.type=i.type==='password'?'text':'password';">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="auth-v2-row" style="margin-top: 1rem;">
                    <label class="auth-v2-checkbox">
                        <input type="checkbox" required>
                        <span class="auth-v2-checkmark"></span>
                        <span style="font-size: 0.85rem; color: var(--text-muted);">I agree to the <a href="/terms" data-route class="auth-v2-link">Terms of Service</a> and <a href="/privacy" data-route class="auth-v2-link">Privacy Policy</a></span>
                    </label>
                </div>
                
                <button type="submit" class="auth-v2-submit">Create Account</button>
            </form>
            
            <div class="auth-v2-divider">
                <span>or sign up with</span>
            </div>
            
            <div class="auth-v2-socials">
                <button class="auth-v2-social-btn" type="button">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google
                </button>
                <button class="auth-v2-social-btn" type="button">
                    <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook"> Facebook
                </button>
            </div>
            
            <p class="auth-v2-footer">Already have an account? <a href="/login" data-route>Sign In</a></p>
        </div>
    </div>
</section>
