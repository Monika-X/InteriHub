<!-- Contact Page -->
<section class="section-padding" style="padding-top: 150px; background-color: var(--bg-primary);">
    <div class="container">
        <h1 class="display-2 reveal-up">Get in Touch</h1>
        <p class="text-lead reveal-up" style="max-width: 600px; margin-top: 2rem; transition-delay: 0.2s;">
            We are currently accepting new commissions for 2027. Please reach out to discuss your architectural or interior design project.
        </p>
    </div>
</section>

<section class="section-padding" style="background-color: var(--bg-secondary);">
    <div class="container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4rem;">
        <div class="reveal-up">
            <h2 class="heading-1">Contact Information</h2>
            <div style="margin-top: 2rem;">
                <h3 style="font-size: 1.25rem;">New York Studio</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">125 Architectural Way<br>Suite 400<br>New York, NY 10012</p>
                <p style="color: var(--color-antique-gold); margin-bottom: 0.5rem;">+1 (212) 555-0199</p>
                <p style="color: var(--text-muted);">inquiries@interihub.com</p>
            </div>
        </div>
        <div class="reveal-up" style="transition-delay: 0.2s; background-color: var(--bg-primary); padding: 3rem; border-radius: 8px;">
            <form>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-family: var(--font-heading); font-size: 1.2rem;">Full Name</label>
                    <input type="text" style="width: 100%; padding: 1rem; border: 1px solid var(--border-color); background: transparent; color: var(--text-primary);">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-family: var(--font-heading); font-size: 1.2rem;">Email Address</label>
                    <input type="email" style="width: 100%; padding: 1rem; border: 1px solid var(--border-color); background: transparent; color: var(--text-primary);">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; margin-bottom: 0.5rem; font-family: var(--font-heading); font-size: 1.2rem;">Project Description</label>
                    <textarea rows="5" style="width: 100%; padding: 1rem; border: 1px solid var(--border-color); background: transparent; color: var(--text-primary);"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Inquiry</button>
            </form>
        </div>
    </div>
</section>
