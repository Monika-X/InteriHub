<section class="auth-v2-page">
    <div class="ax-bg">
        <img src="https://i.pinimg.com/736x/a8/81/97/a881977bf50d59f6ab86a9429f3c36a8.jpg" alt="InteriHub" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMyQTIzMkEiLz48L3N2Zz4=';">
        <div class="ax-overlay" aria-hidden="true"></div>
    </div>
    
    <div class="auth-v2-container">
        <div class="auth-v2-card">
            <a href="/" data-route class="auth-v2-logo" style="text-decoration: none;">
                <img src="assets/logo.svg" alt="InteriHub Logo" width="32" height="32">
                <div style="display: flex; flex-direction: column; justify-content: center; line-height: 1;">
                    <span class="auth-v2-brand-text" style="line-height: 1;">INTERI<span style="color: var(--color-antique-gold);">HUB</span></span>
                    <span style="font-size: 0.55rem; font-family: var(--font-body); letter-spacing: 0.05em; color: var(--color-antique-gold); font-weight: 500; margin-top: 2px;">Where Elegance Meets Comfort.</span>
                </div>
            </a>
            <h1 class="auth-v2-title">Welcome Back</h1>
            <p class="auth-v2-subtitle">Sign in to access your project dashboard.</p>
            
<form class="auth-v2-form">
                <div class="auth-v2-field">
                    <label>Full Name</label>
                    <div class="auth-v2-input-wrap">
                        <input type="text" placeholder="Your full name" required>
                    </div>
                </div>
                <div class="auth-v2-field">
                    <label>Email Address</label>
                    <div class="auth-v2-input-wrap">
                        <input type="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="auth-v2-field">
                    <label>Password</label>
                    <div class="auth-v2-input-wrap">
                        <input type="password" id="auth-pwd" placeholder="Enter your password" required>
                        <button type="button" class="auth-v2-eye" onclick="var i=document.getElementById('auth-pwd');i.type=i.type==='password'?'text':'password';">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="auth-v2-row">
                    <label class="auth-v2-checkbox">
                        <input type="checkbox">
                        <span class="auth-v2-checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="auth-v2-link">Forgot password?</a>
                </div>
                
                <button type="submit" class="auth-v2-submit">Sign In</button>
            </form>
            
            <div class="auth-v2-divider">
                <span>or continue with</span>
            </div>
            
            <div class="auth-v2-socials">
                <button class="auth-v2-social-btn" type="button">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google"> Google
                </button>
                <button class="auth-v2-social-btn" type="button">
                    <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook"> Facebook
                </button>
            </div>
            
            <p class="auth-v2-footer">Don't have an account? <a href="/signup" data-route>Sign Up</a></p>
        </div>
    </div>
</section>
