<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>InteriHub — Redirecting</title>
  <script>
    // GitHub Pages SPA redirect — convert path-based URL into hash route
    (function () {
      var origin  = window.location.origin;
      var path    = window.location.pathname;   // e.g. /InteriHub/about
      var search  = window.location.search;
      var hash    = window.location.hash;

      // Detect repository name on GitHub Pages (e.g. "InteriHub")
      var segments = path.split('/').filter(Boolean);
      var repoName = 'InteriHub';
      var repoIdx = segments.indexOf(repoName);
      
      var base = '/' + repoName + '/';
      var routeSegments = repoIdx >= 0 ? segments.slice(repoIdx + 1) : segments;
      var route = '/' + routeSegments.join('/');
      if (!route || route === '/') route = '/';

      var target = origin + base + '#' + route + (search ? '?' + search.slice(1) : '') + hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body></body>
</html>
